<form action="https://api.web3forms.com/submit" method="POST" class="bg-slate-50 p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
  <!-- 1. Get a free access key from https://web3forms.com by entering admin@amvinfocom.in -->
  <!-- 2. Replace YOUR_ACCESS_KEY_HERE with that key -->
  <input type="hidden" name="access_key" value="bc05f91c-fb1a-449d-a0df-a72e81df3d01">
  <input type="hidden" name="subject" value="New Website Inquiry - AMV INFOCOM">
  <input type="hidden" name="from_name" value="AMV Infocom Web Portal">

  <div class="grid sm:grid-cols-2 gap-4">
    <div>
      <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Contact Name</label>
      <input type="text" name="name" required class="w-full px-3 py-2.5 rounded-lg border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-600" placeholder="Full Name" />
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Company / Organization</label>
      <input type="text" name="company" class="w-full px-3 py-2.5 rounded-lg border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-600" placeholder="Company Name" />
    </div>
  </div>

  <div class="grid sm:grid-cols-2 gap-4">
    <div>
      <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Email Address</label>
      <input type="email" name="email" required class="w-full px-3 py-2.5 rounded-lg border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-600" placeholder="name@company.com" />
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Phone Number</label>
      <input type="tel" name="phone" required class="w-full px-3 py-2.5 rounded-lg border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-600" placeholder="+91 XXXXX XXXXX" />
    </div>
  </div>

  <div>
    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Requirement / Tender Scope</label>
    <textarea name="message" rows="3" required class="w-full px-3 py-2.5 rounded-lg border border-slate-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-600" placeholder="Hardware specs, quantities, AMC duration, or tender details..."></textarea>
  </div>

  <button type="submit" class="w-full py-3 bg-blue-700 hover:bg-blue-800 text-white font-semibold rounded-lg shadow-sm transition text-sm">
    Submit Enquiry
  </button>
</form>
